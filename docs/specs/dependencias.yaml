# Dependências entre as tarefas do plano-de-execucao.md
#
# Formato: uma linha por tarefa.
#   <código>: [<dependências diretas>]   # descrição curta
#
# Uma tarefa pode ser feita, de qualquer pacote, quando todas as dependências
# diretas já estão na origin/dev (PR aceito). Uma tarefa conta como feita
# quando o título de um commit na origin/dev tem o código dela.
#
# Conferir:  dart tool/dependencias.dart verificar P2-1.3
# Listar:    dart tool/dependencias.dart proximas [P2]
# Validar:   dart tool/dependencias.dart validar  (também roda no flutter test)
#
# Ao incluir uma tarefa no plano, inclua a linha aqui no mesmo commit.

