name: petamigo
description: "PetAmigo: saúde animal de cães e gatos (alimentação, petiscos, atividades e peso)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Dependências combinadas em docs/specs/comum/arquitetura.md.
# Nenhuma outra sem combinar com o grupo.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Biblioteca Material oficial (o template do Flutter 3.50 já usa este pacote;
  # `package:flutter/material.dart` está depreciado desde a 3.47).
  material_ui: ^1.1.0

  # Estado, rotas e banco local
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  intl: ^0.20.3

  # Interface e arquivos
  flutter_svg: ^2.5.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6

  # Lembretes (P3)
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # PDF e compartilhamento (P3)
  pdf: ^3.13.1
  share_plus: ^13.3.1

  # Cópia remota opcional (P1 inicializa; P5 usa)
  connectivity_plus: ^7.3.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
