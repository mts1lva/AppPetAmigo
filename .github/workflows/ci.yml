# Confere cada PR para a dev e a main (regra 6 do plano-de-execucao.md):
# dependências entre tarefas válidas, flutter analyze sem avisos e
# flutter test passando (inclusive os testes oficiais e os goldens).
#
# Roda no Windows porque os goldens são gerados no Windows: no Linux a fonte
# é renderizada de outro jeito e a comparação falharia sem motivo.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Análise e testes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Flutter (mesma versão do grupo)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Dependências entre tarefas
        run: dart tool/dependencias.dart validar

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Guardar as diferenças dos goldens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-com-diferenca
          path: test/**/failures/
          if-no-files-found: ignore

  emuladores:
    name: Emuladores Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java (Firestore Emulator e Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Firebase CLI
        run: npm install -g firebase-tools

      - name: Flutter (mesma versão do grupo)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: usarEmuladores conecta no emulador local
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            firebase emulators:exec
            --only auth,firestore
            --project pet-amigo-bac9e
            "flutter test integration_test"
